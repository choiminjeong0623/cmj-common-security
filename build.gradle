// cmj-common-security — 각 업무 서비스가 가져다 쓰는 공통 보안 라이브러리(jar)
// ✅ 실제로도 별개 프로젝트였음. 배포 방식(사내 패키지 저장소 등)은 ⚠️ 미확인 → 예시는 mavenLocal 배포
// 참고용 예시 코드 — 실제 프로젝트 코드가 아님
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.cmj'
version = '1.0.0'
java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
    withSourcesJar()
}

repositories { mavenCentral() }

dependencyManagement {
    imports { mavenBom "org.springframework.boot:spring-boot-dependencies:3.3.5" }
}

dependencies {
    api 'org.springframework.boot:spring-boot-autoconfigure'
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.boot:spring-boot-starter-data-redis'
    api 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    compileOnly 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
}

// ./gradlew publishToMavenLocal → ~/.m2/repository/com/cmj/common-security/1.0.0/
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'common-security'
            from components.java
        }
    }
}
